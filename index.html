<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendario de Actividades Iglesia</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app-wrapper">
    <header class="main-header">
      <div class="header-content">
        <h1>Calendario de Actividades</h1>
        <p id="globalCounter">Cargando programación...</p>
      </div>
      <div class="month-navigation" id="monthTabs">
        <button class="nav-tab active" data-month="5">Junio</button>
        <button class="nav-tab" data-month="6">Julio</button>
      </div>
    </header>

    <div class="dashboard-layout">

      <section class="calendar-card">
        <div class="weekdays-grid">
          <div>Dom</div>
          <div>Lun</div>
          <div>Mar</div>
          <div>Miér</div>
          <div>Jue</div>
          <div>Vier</div>
          <div>Sáb</div>
        </div>
        <div class="days-grid" id="calendarDays">
        </div>
      </section>

      <section class="agenda-card">
        <h2>Actividades del Mes</h2>
        <div class="timeline-list" id="timelineList">
        </div>
      </section>

    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
